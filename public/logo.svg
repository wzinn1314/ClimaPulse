<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo escuro estilo Glassmorphism -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2638"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </radialGradient>

    <!-- Gradiente Vermelho Neon Pulse -->
    <linearGradient id="pulseRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e27"/>
      <stop offset="100%" stop-color="#b20710"/>
    </linearGradient>

    <!-- Brilho Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Circular com borda sutil -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>

  <!-- Órbita Externa (Globo/Clima) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="12" stroke-dasharray="20 15"/>
  
  <!-- Anel Neon Secundário -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#pulseRed)" stroke-width="8" opacity="0.6"/>

  <!-- Pulso / Raio central (ClimaPulse) -->
  <path d="M 140 260 L 210 260 L 235 170 L 277 340 L 302 230 L 327 260 L 372 260" 
        fill="none" 
        stroke="url(#pulseRed)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)"/>

  <!-- Ponto de pulso brilhante -->
  <circle cx="277" cy="340" r="14" fill="#ffffff"/>
</svg>
